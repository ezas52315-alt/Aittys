<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Айтыс алаңы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tv-green': '#0a2e1d',
                        'tv-green-dark': '#04170e',
                        'tv-gold': '#d4af37',
                        'tv-gold-light': '#f3e5ab',
                        'tv-gold-dark': '#b38b22',
                        'tv-accent': '#8b1e1e',
                    },
                    fontFamily: {
                        'title': ['"Playfair Display"', 'serif'],
                        'body': ['Montserrat', 'sans-serif'],
                    },
                    boxShadow: {
                        'gold-glow': '0 0 20px rgba(212, 175, 55, 0.5)',
                        'gold-glow-lg': '0 0 40px rgba(212, 175, 55, 0.7)',
                        'card-shadow': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #04170e;
            background-image: 
                radial-gradient(circle at 50% 0%, #114b30 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, #0a2e1d 0%, #04170e 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        .gold-text {
            background: linear-gradient(to bottom, #fffde4 0%, #d4af37 50%, #aa8c2c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            filter: drop-shadow(0 0 2px rgba(212,175,55,0.5));
        }

        .gold-border {
            border: 2px solid #d4af37;
            box-shadow: inset 0 0 15px rgba(212,175,55,0.2), 0 0 15px rgba(212,175,55,0.2);
        }

        .glass-panel {
            background: rgba(10, 46, 29, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-btn {
            background: linear-gradient(145deg, #186341 0%, #0a2e1d 100%);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .game-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(243, 229, 171, 0.3), transparent);
            transform: skewX(-25deg);
            transition: all 0.6s ease;
        }

        .game-btn:hover:not(:disabled)::before {
            left: 200%;
        }

        .game-btn:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
            border-color: #f3e5ab;
            background: linear-gradient(145deg, #1c754d 0%, #0d3b25 100%);
        }

        .game-btn:active:not(:disabled) {
            transform: translateY(2px) scale(0.98);
        }

        .game-btn:disabled {
            background: rgba(0,0,0,0.4);
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transform: none;
            text-shadow: none;
        }

        .game-btn:disabled .played-marker {
            opacity: 1;
        }

        .played-marker {
            opacity: 0;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(4, 23, 14, 0.8);
            backdrop-filter: blur(2px);
            color: #d4af37;
            font-size: 1.5rem;
            transition: opacity 0.3s ease;
        }

        /* Modal Animations */
        .modal-enter {
            animation: modalIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .modal-exit {
            animation: modalOut 0.4s ease-in forwards;
        }

        @keyframes modalIn {
            0% { transform: scale(0.7) translateY(100px) rotateX(-20deg); opacity: 0; }
            100% { transform: scale(1) translateY(0) rotateX(0); opacity: 1; }
        }

        @keyframes modalOut {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0.9) translateY(50px); opacity: 0; }
        }

        /* Decorative Elements */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem 0;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .ornament-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 C 60 30, 80 40, 90 50 C 80 60, 60 70, 50 90 C 40 70, 20 60, 10 50 C 20 40, 40 30, 50 10 Z" fill="none" stroke="rgba(212,175,55,0.03)" stroke-width="1"/></svg>');
            pointer-events: none;
            z-index: 0;
        }

        /* Score Animation */
        .score-pop {
            animation: scorePopAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scorePopAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* Responsive Adjustments */
        @media (max-width: 1024px) {
            .grid-cols-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 768px) {
            .grid-cols-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .header-container { flex-direction: column; gap: 1rem; }
            .title-wrapper { flex-direction: column; text-align: center; }
        }
        @media (max-width: 480px) {
            .grid-cols-5 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        }
    </style>
</head>
<body class="font-body flex flex-col items-center pb-12 px-4 relative">
    <div class="ornament-bg"></div>

    <!-- Header Section with Dombyra and Title -->
    <header class="w-full max-w-7xl mx-auto z-10 mt-6 mb-8">
        <div class="header-container w-full flex flex-col xl:flex-row justify-between items-center gap-8">
            
            <div class="title-wrapper flex-1 w-full justify-center xl:justify-start">
                <div class="text-center xl:text-left flex flex-col items-center xl:items-start pt-8 pr-16 md:pr-24 relative">
                    <div class="relative inline-flex flex-col items-center xl:items-start">
                        <h1 class="text-5xl md:text-6xl lg:text-7xl font-title uppercase tracking-widest gold-text font-bold whitespace-nowrap z-10 relative">
                            Айтыс алаңы
                        </h1>
                        <div class="h-1 w-full max-w-[200px] bg-gradient-to-r from-transparent via-tv-gold to-transparent mt-3 mb-2"></div>
                        <p class="text-tv-gold-light text-lg md:text-xl font-medium tracking-wider uppercase">Зияткерлік сайыс</p>
                    </div>
                </div>
            </div>

            <!-- Scoreboard Area Container -->
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 sm:gap-6 w-full xl:w-auto">
                
                <!-- Кіріктірілген сурет (Экранға сіңіскен, контурсыз) -->
                <img src="https://alataugazeti.kz/wp-content/uploads/2026/09/IMG_1998-1.png" 
                     alt="Айтыс бейнесі" 
                     class="w-48 sm:w-64 md:w-80 lg:w-96 h-auto object-contain transition-opacity duration-700 opacity-85 hover:opacity-100"
                     style="-webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 85%); mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 85%); border: none;">

                <!-- Бірыңғай Ұпайлар тақтасы (Scoreboard) -->
                <div class="relative flex justify-between items-center gap-2 sm:gap-6 glass-panel rounded-3xl p-4 sm:p-6 gold-border shadow-gold-glow w-full max-w-lg xl:max-w-md shrink-0">
                    
                    <!-- Ортадағы бөлгіш алтын сызық -->
                    <div class="absolute left-1/2 top-4 bottom-4 w-[1px] bg-gradient-to-b from-transparent via-tv-gold to-transparent -translate-x-1/2"></div>

                    <!-- I Топ -->
                    <div class="flex flex-col items-center flex-1 z-10">
                        <h2 class="text-sm sm:text-xl font-bold text-tv-gold-light mb-1 uppercase tracking-widest drop-shadow-md">I Топ</h2>
                        <div class="text-4xl sm:text-5xl font-bold text-white mb-3 font-title drop-shadow-md" id="score1">0</div>
                        <div class="flex gap-2 sm:gap-3">
                            <button onclick="updateScore(1, false)" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-red-900/60 border-2 border-red-500 hover:bg-red-700 flex items-center justify-center text-xl sm:text-2xl font-bold transition transform hover:scale-110 shadow-lg" title="Ұпайды шегеру">-</button>
                            <button onclick="updateScore(1, true)" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-green-900/60 border-2 border-green-500 hover:bg-green-700 flex items-center justify-center text-xl sm:text-2xl font-bold transition transform hover:scale-110 shadow-lg" title="Ұпай қосу">+</button>
                        </div>
                    </div>

                    <!-- II Топ -->
                    <div class="flex flex-col items-center flex-1 z-10">
                        <h2 class="text-sm sm:text-xl font-bold text-tv-gold-light mb-1 uppercase tracking-widest drop-shadow-md">II Топ</h2>
                        <div class="text-4xl sm:text-5xl font-bold text-white mb-3 font-title drop-shadow-md" id="score2">0</div>
                        <div class="flex gap-2 sm:gap-3">
                            <button onclick="updateScore(2, false)" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-red-900/60 border-2 border-red-500 hover:bg-red-700 flex items-center justify-center text-xl sm:text-2xl font-bold transition transform hover:scale-110 shadow-lg" title="Ұпайды шегеру">-</button>
                            <button onclick="updateScore(2, true)" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-green-900/60 border-2 border-green-500 hover:bg-green-700 flex items-center justify-center text-xl sm:text-2xl font-bold transition transform hover:scale-110 shadow-lg" title="Ұпай қосу">+</button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto z-10 relative px-2">
        <!-- Status Bar -->
        <div class="flex justify-center mb-6">
            <div class="glass-panel inline-flex items-center gap-3 px-6 py-2 rounded-full gold-border shadow-md">
                <span class="text-gray-300 text-sm md:text-base">Белсенді сұрақ құны:</span>
                <span id="activeValueDisplay" class="font-bold text-xl md:text-2xl text-white font-title transition-colors duration-300">0</span>
            </div>
        </div>
        
        <!-- Game Board Grid (5 Columns) -->
        <div id="gameBoard" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-5 w-full">
            <!-- Populated by JS -->
        </div>
    </main>

    <!-- Modal Overlay -->
    <div id="questionModal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4">
        
        <div id="modalContent" class="glass-panel w-full max-w-4xl rounded-3xl gold-border shadow-gold-glow-lg p-8 md:p-12 flex flex-col items-center text-center relative max-h-[90vh] overflow-y-auto">
            
            <!-- Value Indicator -->
            <div class="absolute -top-6 bg-gradient-to-b from-tv-gold-light to-tv-gold-dark text-black font-title font-bold text-3xl px-8 py-2 rounded-full border-4 border-tv-green shadow-xl" id="modalValueBadge">
                0
            </div>

            <!-- Close Button (X) -->
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Category -->
            <h3 class="text-2xl md:text-3xl text-tv-gold-light mt-4 mb-6 font-bold uppercase tracking-widest border-b-2 border-tv-gold/30 pb-4 w-full font-title" id="modalCategory">
                Тақырып
            </h3>
            
            <!-- Question -->
            <div class="min-h-[200px] flex items-center justify-center w-full my-6 bg-black/30 rounded-2xl p-6 border border-white/5">
                <p class="text-2xl md:text-4xl font-body font-medium leading-relaxed text-white drop-shadow-md" id="modalQuestionText">
                    Сұрақ осында болады...
                </p>
            </div>

            <!-- Answer Section -->
            <div id="answerSection" class="w-full hidden mt-2 pt-6 border-t border-tv-gold/30 bg-green-900/20 rounded-2xl p-6">
                <p class="text-tv-gold-dark font-bold text-sm uppercase tracking-widest mb-3">Дұрыс жауап:</p>
                <p class="text-xl md:text-3xl text-green-400 font-medium leading-snug" id="modalAnswerText">
                    Дұрыс жауап осында.
                </p>
            </div>

            <!-- Actions -->
            <div class="mt-8 flex flex-col sm:flex-row gap-4 w-full justify-center">
                <button id="btnShowAnswer" onclick="showAnswer()" class="px-10 py-4 bg-gradient-to-r from-tv-gold-dark via-tv-gold to-tv-gold-light text-black font-bold text-lg rounded-xl hover:shadow-gold-glow transition transform hover:-translate-y-1 w-full sm:w-auto">
                    Жауапты көру
                </button>
                <button id="btnReturn" onclick="closeModal()" class="hidden px-10 py-4 bg-transparent border-2 border-tv-gold text-tv-gold font-bold text-lg rounded-xl hover:bg-tv-gold/10 transition w-full sm:w-auto">
                    Тақтаға оралу
                </button>
            </div>
        </div>
    </div>

    <script>
        const gameData = [
            {
                title: "Біржанның сыны",
                questions: [
                    { val: 20, q: "Біржан кімге зорлық болмас, кімді наданға жылатып берме дейді?", a: "«Законда зорлық болмас жақсы адамға» дейді және жақсыны наданға жылатып бермеуді аят пен хадистен мысал етеді." },
                    { val: 30, q: "Біржан қызды Жиенқұлға бергенді қандай жазамен теңейді?", a: "Қытайша он есе артық басын шапқаннан да жаман қорлыққа теңейді («Қор қылып Жиенқұлға жібергеннен, Қытайша он есе артық басын шапса»)." },
                    { val: 40, q: "Біржан кімдерге «Сараның обалы сендерге» деп кінә тағады?", a: "Есімбек пен Тұрысбекке («Обалың Есімбек пен Тұрысбекке, Жігітің жөндеу екен, ей, бейшара»)." }
                ]
            },
            {
                title: "Сараның мұңы",
                questions: [
                    { val: 20, q: "Сара Біржанға ризашылығын білдіріп, құрмет ретінде не береді?", a: "Шіркінге қимағаннан жорға береді («Шіркінге қимағаннан жорға бердім, Басында сөйлессем де жамандасып»)." },
                    { val: 30, q: "Сара «Көрмейсіз менің неге көз жасымды» деп кімдерден басын арашалауды сұрап мұң шағады?", a: "Жиылған Қаптағайдың жақсыларынан және қажы ағасынан («Жиылған қаптағайдың жақсылары, Басқаға айырып бер, өз басымды»)." },
                    { val: 40, q: "Сара өзінің еркіндігі болғанда Біржанды қалай жеңер едім дейді?", a: "Аттатпай адымын бұрар едім, келместей қып жығар едім дейді («Сыйладым сағың жерде қалмасын деп, Аттатпай адымыңды бұрар едім»)." }
                ]
            },
            {
                title: "Айтыстың түйіні",
                questions: [
                    { val: 20, q: "Біржан Сараны өлеңде кімге, неге теңейді?", a: "«Шежіре туған дана», «Өлеңге жан көрмедім мұнан ұста» деп аса жоғары бағалайды." },
                    { val: 30, q: "Біржан Жиенқұлды айтыс өтіп жатқан жерге неге алдырма дейді?", a: "Өнерсіз, үйде «аһ» ұруды ғана білетін адамды көріп зығырданым қайнар, бекер алдырма дейді («Алдырма бекер мұнда кәпіріңді»)." },
                    { val: 40, q: "Біржан Сараның өнерін мақтап, Есекеңе (Есімбекке) қандай баға айтады?", a: "«Аты ұрғашы демесең қарындасың, Адамның артығы екен осы тұста. Қуға салса, ұшқан құс та ілеспес» деп бағалайды." }
                ]
            },
            {
                title: "Айтыс табиғаты",
                questions: [
                    { val: 20, q: "Ахмет Байтұрсынұлы айтысты қандай жекпе-жектерге теңеді?", a: "Екі палуанның күрескеніне, екі ойыншының ұтысқанына, екі батырдың жекпе-жек ұрысқанына." },
                    { val: 30, q: "М.Әуезовтің айтуынша, айтыскерлер жеңілгенде қандай себеппен жеңіледі?", a: "Өлең таба алмағандықтан емес, ұтымды дәлелден жұтап, жүйеге жығылып барып жеңіледі." },
                    { val: 40, q: "Айтыстағы басты түйін, яғни қандай жүйрік ақын болса да жалтарып құтыла алмайтын нәрсе не?", a: "Шындық." }
                ]
            },
            {
                title: "Қазіргі айтыс",
                questions: [
                    { val: 20, q: "Тәуелсіздік тұсында айтыстың қоғамдағы рөлі қандай?", a: "Ұлт өміріндегі рухани қызметі артып, өзекті қоғамдық-әлеуметтік мәселелердің шешілуіне ықпал етуде." },
                    { val: 30, q: "Қазіргі айтыста көтерілетін ұлттық мүддеге қатысты кемінде 3 мәселені атаңыз.", a: "Қазақ тілінің тағдыры, жердің жекеменшікке өтуі, қандастар жағдайы, балалардың шетелге берілуі, ұлттық байлық." },
                    { val: 40, q: "Ақындар айтысының саңлақтары болып саналатын кем дегенде екі жұпты атаңыз.", a: "Жамбыл мен Құлмамбет, Шөже мен Кемпірбай, Біржан мен Сара, Әсет мен Рысжан." }
                ]
            }
        ];

        let scores = { 1: 0, 2: 0 };
        let currentActiveValue = 0;

        // Tone.js Audio Setup
        let audioInit = false;
        let synths = {};

        function initAudio() {
            if (audioInit) return;
            try {
                Tone.start();
                
                // Opener / Select question sound
                synths.open = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 1 }
                }).toDestination();
                synths.open.volume.value = -8;

                // Correct answer / Add points
                synths.correct = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1.5 }
                }).toDestination();
                synths.correct.volume.value = -6;

                // Wrong answer / Deduct points
                synths.wrong = new Tone.FMSynth({
                    modulationIndex: 12.22,
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5 },
                    modulation: { type: "square" },
                    modulationEnvelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0 }
                }).toDestination();
                synths.wrong.volume.value = -8;

                // Reveal Answer sound
                synths.reveal = new Tone.MetalSynth({
                    frequency: 200,
                    envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
                    harmonicity: 5.1,
                    modulationIndex: 32,
                    resonance: 4000,
                    octaves: 1.5
                }).toDestination();
                synths.reveal.volume.value = -15;

                audioInit = true;
            } catch (e) {
                console.log("Audio initialization failed or not supported yet.", e);
            }
        }

        function playSound(type) {
            if (!audioInit) initAudio();
            if (!audioInit) return; // If still not init, fail silently

            const now = Tone.now();
            if (type === 'open') {
                synths.open.triggerAttackRelease(["E4", "A4"], "8n", now);
            } else if (type === 'correct') {
                synths.correct.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                synths.correct.triggerAttackRelease(["C5", "E5", "G5"], "4n", now + 0.15);
            } else if (type === 'wrong') {
                synths.wrong.triggerAttackRelease("G2", "8n", now);
                synths.wrong.triggerAttackRelease("C2", "4n", now + 0.15);
            } else if (type === 'reveal') {
                synths.open.triggerAttackRelease(["A4", "C5", "E5"], "4n", now);
            }
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            gameData.forEach((category, catIndex) => {
                // Column container
                const col = document.createElement('div');
                col.className = 'flex flex-col gap-3 md:gap-4 w-full';

                // Category Header
                const header = document.createElement('div');
                header.className = 'glass-panel text-center p-3 md:p-4 rounded-xl gold-border shadow-md h-24 md:h-28 flex items-center justify-center bg-tv-green/80';
                header.innerHTML = `<h3 class="text-tv-gold font-bold text-sm md:text-base lg:text-lg leading-tight font-title uppercase drop-shadow-md">${category.title}</h3>`;
                col.appendChild(header);

                // Question Buttons
                category.questions.forEach((q, qIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'game-btn gold-border py-6 md:py-8 text-3xl md:text-4xl font-bold text-white w-full font-title flex items-center justify-center group';
                    
                    // Main value span
                    const valSpan = document.createElement('span');
                    valSpan.className = 'group-hover:scale-110 transition-transform duration-300';
                    valSpan.innerText = q.val;
                    btn.appendChild(valSpan);

                    // Played marker (hidden initially)
                    const playedMarker = document.createElement('div');
                    playedMarker.className = 'played-marker font-title';
                    playedMarker.innerHTML = '<span class="text-xl md:text-2xl opacity-60">🎵</span>';
                    btn.appendChild(playedMarker);

                    btn.onclick = (e) => openQuestion(catIndex, qIndex, btn);
                    col.appendChild(btn);
                });

                board.appendChild(col);
            });
        }

        function openQuestion(catIdx, qIdx, btnElement) {
            playSound('open');
            
            const qData = gameData[catIdx].questions[qIdx];
            
            // Set current active value
            currentActiveValue = qData.val;
            const display = document.getElementById('activeValueDisplay');
            display.innerText = currentActiveValue;
            display.classList.add('text-tv-gold', 'scale-110');
            setTimeout(() => display.classList.remove('scale-110'), 300);

            // Populate Modal
            document.getElementById('modalCategory').innerText = gameData[catIdx].title;
            document.getElementById('modalQuestionText').innerText = qData.q;
            document.getElementById('modalAnswerText').innerText = qData.a;
            document.getElementById('modalValueBadge').innerText = qData.val;
            
            // Reset modal UI state
            document.getElementById('answerSection').classList.add('hidden');
            document.getElementById('btnShowAnswer').classList.remove('hidden');
            document.getElementById('btnReturn').classList.add('hidden');
            
            // Disable button visually
            btnElement.disabled = true;

            // Show Modal with animation
            const modal = document.getElementById('questionModal');
            const content = document.getElementById('modalContent');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            content.classList.remove('modal-exit');
            content.classList.add('modal-enter');
        }

        function showAnswer() {
            playSound('reveal');
            document.getElementById('answerSection').classList.remove('hidden');
            document.getElementById('btnShowAnswer').classList.add('hidden');
            document.getElementById('btnReturn').classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('questionModal');
            const content = document.getElementById('modalContent');
            
            content.classList.remove('modal-enter');
            content.classList.add('modal-exit');
            
            // Wait for animation to finish
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 350); // matches css animation duration
        }

        function updateScore(team, isAdding) {
            if (currentActiveValue === 0) {
                // Visual feedback if no question is active
                const display = document.getElementById('activeValueDisplay');
                display.classList.add('text-red-500', 'animate-bounce');
                setTimeout(() => display.classList.remove('text-red-500', 'animate-bounce'), 1000);
                return; 
            }

            if (isAdding) {
                scores[team] += currentActiveValue;
                playSound('correct');
                animateScore(team, 'add');
            } else {
                scores[team] -= currentActiveValue;
                playSound('wrong');
                animateScore(team, 'deduct');
            }

            document.getElementById(`score${team}`).innerText = scores[team];
            
            // Reset active value after scoring
            currentActiveValue = 0;
            const display = document.getElementById('activeValueDisplay');
            display.innerText = '0';
            display.classList.remove('text-tv-gold');
        }

        function animateScore(team, type) {
            const el = document.getElementById(`score${team}`);
            
            el.classList.remove('score-pop', 'text-green-400', 'text-red-500');
            // trigger reflow
            void el.offsetWidth;
            
            el.classList.add('score-pop');
            if(type === 'add') el.classList.add('text-green-400');
            if(type === 'deduct') el.classList.add('text-red-500');
            
            setTimeout(() => {
                el.classList.remove('score-pop', 'text-green-400', 'text-red-500');
            }, 500);
        }

        // Initialize
        window.onload = () => {
            renderBoard();
            
            // Init audio context on first user interaction
            document.body.addEventListener('click', () => {
                if(!audioInit) initAudio();
            }, { once: true });
        };
    </script>
</body>
</html>
